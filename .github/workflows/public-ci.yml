name: Public CI

on:
  push:
    branches: [main, sync/private-main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tree-policy:
    name: Public tree policy
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify public snapshot boundary
        run: python .github/scripts/verify_snapshot.py

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    needs: public-tree-policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect simulator source
        id: project
        run: |
          if [[ -f pyproject.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.project.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and test dependencies
        if: steps.project.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test,gui]"
      - name: Compile Python sources
        if: steps.project.outputs.present == 'true'
        run: python -m compileall -q src validation tools benchmarks tests
      - name: Run unit tests
        if: steps.project.outputs.present == 'true'
        run: pytest -q tests/unit
      - name: Confirm bootstrap state
        if: steps.project.outputs.present != 'true'
        run: echo "No simulator snapshot has been published yet."

  package:
    name: Package audit
    needs: public-tree-policy
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect simulator source
        id: project
        run: |
          if [[ -f pyproject.toml ]]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Set up Python
        if: steps.project.outputs.present == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
      - name: Build and validate distributions
        if: steps.project.outputs.present == 'true'
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine
          python -m build
          python -m twine check dist/*
      - name: Inspect distribution contents
        if: steps.project.outputs.present == 'true'
        run: python .github/scripts/audit_distribution.py dist
      - name: Confirm bootstrap state
        if: steps.project.outputs.present != 'true'
        run: echo "No simulator package has been published yet."
