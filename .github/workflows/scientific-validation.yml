name: Scientific validation

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      freeze_reference:
        description: "Create an immutable reference artifact for review"
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  scientific-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      MPLCONFIGDIR: /tmp/hermes-mplconfig
      XDG_CACHE_HOME: /tmp/hermes-xdg-cache
      PYTHONPATH: ${{ github.workspace }}/src:${{ github.workspace }}:${{ github.workspace }}/tools
      BASELINE_RUN_ID: ${{ vars.HERMES_REFERENCE_RUN_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install scientific runtime
        run: python -m pip install -e ".[test]"
      - name: Verify PEC plate and sphere mesh convergence
        run: python -m validation.analytic --output internal/outputs/analytic
      - name: Report plate and corner RT ray-density convergence
        run: python -m validation.analytic_rt --output internal/outputs/rt-convergence
      - name: Run native solver fixtures across seeds
        run: |
          python tools/release_validation.py run \
            --config configs/release_validation.json \
            --output internal/outputs/release-validation
      - name: Download reviewed reference
        if: env.BASELINE_RUN_ID != ''
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: hermes-release-reference
          run-id: ${{ vars.HERMES_REFERENCE_RUN_ID }}
          github-token: ${{ github.token }}
          path: internal/references/reviewed
      - name: Compare frozen release outputs
        if: env.BASELINE_RUN_ID != ''
        run: |
          python tools/release_validation.py compare \
            --run internal/outputs/release-validation --reference internal/references/reviewed
      - name: Require a reviewed baseline for tagged releases
        if: env.BASELINE_RUN_ID == ''
        run: |
          echo "::notice::Release regression was not run: HERMES_REFERENCE_RUN_ID is not configured."
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            echo "::error::A tagged release requires a reviewed frozen reference."
            exit 1
          fi
      - name: Assemble release validation report
        if: always()
        run: |
          if [[ -f internal/outputs/release-validation/run.json ]]; then
            python tools/release_validation.py report \
              --run internal/outputs/release-validation \
              --analytic internal/outputs/analytic/analytic.json \
              --rt-convergence internal/outputs/rt-convergence/rt_convergence.json
          fi
      - name: Freeze release or candidate reference
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.freeze_reference)
        env:
          REFERENCE_RELEASE: ${{ github.event.release.tag_name || github.sha }}
        run: |
          python tools/release_validation.py freeze \
            --run internal/outputs/release-validation \
            --reference internal/references/new --release "$REFERENCE_RELEASE"
      - name: Upload frozen reference
        if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.freeze_reference)
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: hermes-release-reference
          path: internal/references/new/
          if-no-files-found: error
          retention-days: 90
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: scientific-validation
          path: internal/outputs/
          if-no-files-found: error
          retention-days: 90

  publish-release-evidence:
    if: github.event_name == 'release'
    needs: scientific-validation
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: scientific-validation
          path: evidence
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: hermes-release-reference
          path: evidence/references
      - name: Archive validation report and reference arrays
        run: tar -czf hermes-scientific-validation.tar.gz -C evidence .
      - name: Attach evidence to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" hermes-scientific-validation.tar.gz --repo "$GITHUB_REPOSITORY"
