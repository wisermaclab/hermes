[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-radar-sim"
version = "0.2.0"
description = "HERMES: Human-Environment Radar ModEling and Simulation utilities for mmWave FMCW radar"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = [
    "LICENSE",
    "LICENSE-DOCS-DATA",
    "NOTICE",
    "COMMERCIAL-LICENSING.md",
    "THIRD_PARTY_NOTICES.md",
]
authors = [
    {name = "Rong Zheng"},
]
keywords = [
    "mmwave",
    "hermes",
    "radar",
    "fmcw",
    "sionna-rt",
    "physical optics",
    "human motion",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "sionna-rt==2.0.1",
    "numpy>=1.26",
    "scipy>=1.14.1",
    "matplotlib>=3.10",
    "Pillow>=10",
    "mitsuba==3.8.0",
    "drjit==1.3.1",
    "typing-extensions>=4.12.2",
    "jsonschema>=4.23",
]

[project.urls]
Repository = "https://github.com/wisermaclab/hermes"
Issues = "https://github.com/wisermaclab/hermes/issues"

[project.optional-dependencies]
smpl = [
    "torch",
    "smplx",
]
notebook = [
    "jupyter",
    "ipywidgets>=8.1.5",
    "pythreejs>=2.4.2",
]
gui = [
    "panel>=1.9,<2",
    "plotly>=6,<7",
]
test = [
    "pytest>=8.3.4",
]
dev = [
    "pytest>=8.3.4",
    "pylint==3.3.9",
    "mypy==1.20.2",
    "black==26.10.1",
]


[project.scripts]
mmwave-radial-velocity-diagnostic = "mmWaveRadar.diagnostics.radial_velocity_geometry:main"
mmwave-validation-benchmark = "validation.cli:main"
mmwave-check-bundle = "bundle_prepare.integrity:main"
mmwave-prepare-bundle = "bundle_prepare.cli:main"
hermes-gui = "mmWaveRadar.gui.cli:main"
hermes-human-room = "mmWaveRadar.gui.scene_cli:main"
hermes-release-validation = "validation.release:main"


[tool.setuptools]
include-package-data = false


[tool.setuptools.packages.find]
where = ["src", ".", "tools"]
include = ["mmWaveRadar*", "validation*", "bundle_prepare"]

[tool.setuptools.package-data]
bundle_prepare = ["data/static_target/*"]

[tool.setuptools.data-files]
"share/doc/hermes-radar-sim" = ["CHANGELOG.md", "CITATION.cff"]
"share/doc/hermes-radar-sim/scientific-validation" = [
    "docs/limitations.md", "docs/stability.md", "docs/scientific_validation.md",
]
"share/doc/hermes-radar-sim/scenes" = ["data/scenes/empty_room.xml"]
"share/doc/hermes-radar-sim/validation" = [
    "validation/BUNDLE_SPEC.md",
    "validation/README.md",
]
"share/doc/hermes-radar-sim/validation/schema" = [
    "validation/schema/bundle.schema.json",
    "validation/schema/environment.schema.json",
    "validation/schema/frames.schema.json",
    "validation/schema/sensor.schema.json",
]
"share/doc/hermes-radar-sim/bundle_prepare" = [
    "tools/bundle_prepare/README.md",
    "tools/bundle_prepare/BRING_YOUR_OWN.md",
    "tools/bundle_prepare/ADAPTER_GUIDE.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tools"]

[tool.black]
line-length = 99
target-version = ["py310"]
required-version = "26.10.1"

[tool.pylint.main]
py-version = "3.10"
recursive = true
persistent = false

[tool.pylint.messages_control]
# Black owns formatting. These checks catch source and control-flow errors
# without inferring attributes of Panel, Mitsuba or dynamically loaded solvers.
disable = ["all"]
enable = [
    "fatal",
    "syntax-error",
    "undefined-variable",
    "used-before-assignment",
    "unused-import",
    "duplicate-key",
    "unreachable",
    "nonexistent-operator",
    "invalid-all-object",
    "invalid-all-format",
    "notimplemented-raised",
    "function-redefined",
]

[tool.pylint.format]
max-line-length = 99

[tool.pylint.reports]
reports = false
score = false

[tool.mypy]
python_version = "3.10"
files = ["src/mmWaveRadar/gui/workflows", "src/mmWaveRadar/gui/assembly.py"]
follow_imports = "silent"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# GUI services and compiled solver libraries are outside this dependency check.
module = ["mmWaveRadar.gui.app", "mitsuba.*", "drjit.*", "sionna.*", "torch.*"]
follow_imports = "skip"
follow_imports_for_stubs = true
