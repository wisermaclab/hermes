[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hermes-radar-sim"
version = "0.1.0"
description = "HERMES: Human-Environment Radar ModEling and Simulation utilities for mmWave FMCW radar"
readme = "README.md"
requires-python = ">=3.10"
license = "PolyForm-Noncommercial-1.0.0"
license-files = [
    "LICENSE",
    "LICENSE-DOCS-DATA",
    "NOTICE",
    "COMMERCIAL-LICENSING.md",
    "THIRD_PARTY_NOTICES.md",
]
authors = [
    {name = "Rong Zheng"},
]
keywords = [
    "mmwave",
    "hermes",
    "radar",
    "fmcw",
    "sionna-rt",
    "physical optics",
    "human motion",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
]
dependencies = [
    "sionna-rt==2.0.1",
    "numpy>=1.26",
    "scipy>=1.14.1",
    "matplotlib>=3.10",
    "Pillow>=10",
    "mitsuba==3.8.0",
    "drjit==1.3.1",
    "typing-extensions>=4.12.2",
    "jsonschema>=4.23",
]

[project.urls]
Repository = "https://github.com/wisermaclab/hermes"
Issues = "https://github.com/wisermaclab/hermes/issues"

[project.optional-dependencies]
smpl = [
    "torch",
    "smplx",
]
notebook = [
    "jupyter",
    "ipywidgets>=8.1.5",
    "pythreejs>=2.4.2",
]
gui = [
    "panel>=1.9,<2",
    "plotly>=6,<7",
]
test = [
    "pytest>=8.3.4",
]
dev = [
    "pytest>=8.3.4",
    "pylint>=3.3.2",
]


[project.scripts]
mmwave-radial-velocity-diagnostic = "mmWaveRadar.diagnostics.radial_velocity_geometry:main"
mmwave-validation-benchmark = "validation.cli:main"
mmwave-check-bundle = "bundle_prepare.integrity:main"
hermes-gui = "mmWaveRadar.gui.cli:main"


[tool.setuptools]
include-package-data = false


[tool.setuptools.packages.find]
where = ["src", ".", "tools"]
include = ["mmWaveRadar*", "validation*", "bundle_prepare"]

[tool.setuptools.data-files]
"share/doc/hermes-radar-sim" = ["CHANGELOG.md"]
"share/doc/hermes-radar-sim/validation" = [
    "validation/BUNDLE_SPEC.md",
    "validation/README.md",
]
"share/doc/hermes-radar-sim/validation/schema" = [
    "validation/schema/bundle.schema.json",
    "validation/schema/environment.schema.json",
    "validation/schema/frames.schema.json",
    "validation/schema/sensor.schema.json",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", ".", "tools"]
